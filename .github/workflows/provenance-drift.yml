name: Dérive des JSON du site

# Le check exigé `provenance` (ci.yml) compare les copies de src/ au commit du site
# épinglé dans scripts/layout-provenance.json : il ne bouge plus quand le site évolue.
# Ce workflow, non exigé, compare chaque jour à la tête de la branche suivie : rouge
# = le site a changé un des trois JSON, copies à resynchroniser puis à réépingler
# (Sync-LayoutResources.ps1, puis check-layout-provenance.py --epingler SHA).
# Code 2 (original illisible) : branche disparue ou réseau, à lire avant d'agir.

on:
  schedule:
    # 06:45 heure de Paris en hiver, 07:45 en été.
    - cron: "45 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provenance-drift
  cancel-in-progress: true

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Actions épinglées par SHA de commit complet, tag en commentaire.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Les copies suivent la branche du site
        run: python scripts/check-layout-provenance.py --branche
