name: Microsoft Store analytics

on:
  schedule:
    # 06:15 heure de Paris en hiver, 07:15 en été.
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Début du backfill (AAAA-MM-JJ)"
        required: false
        default: "2015-01-01"

permissions:
  contents: read
  id-token: write

concurrency:
  group: microsoft-store-analytics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Chaque requête peut attendre jusqu'à 4 x 120 s plus les pauses de backoff.
    timeout-minutes: 45
    # Aucun secret ici : un `env:` de job est visible de toutes ses étapes, actions
    # tierces comprises. Les identifiants Partner Center (rôle Manager) ne vont qu'à
    # l'étape de collecte (audit 1.3.0 final, A03-01).
    env:
      STORE_ID: 9N4BTS43SSSZ
      STORE_ANALYTICS_START_DATE: ${{ inputs.start_date || '2015-01-01' }}
      STORE_ANALYTICS_OUTPUT: ${{ github.workspace }}/store-analytics/out

    # Actions épinglées par SHA de commit complet, tag en commentaire : un tag
    # déplacé ne change plus le code qui tourne dans ce job.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Le collecteur n'utilise que la bibliothèque standard : rien à installer. Le
      # paquet est lu dans src/, sans pip ni setuptools téléchargés depuis PyPI.
      - name: Tester
        env:
          PYTHONPATH: ${{ github.workspace }}/store-analytics/src
        run: python -m unittest discover -s store-analytics/tests -v

      # Le client réessaie seul sur 408, 429, 5xx et erreurs réseau (backoff 5-10-20 s,
      # Retry-After respecté). Sortie 2 : un jeu manque encore ; les autres sont écrits,
      # donc on archive d'abord et on passe au rouge à la dernière étape. Toute autre
      # sortie non nulle (jeton refusé, configuration absente) arrête le job ici.
      # Seule étape qui reçoit les identifiants Partner Center.
      - name: Collecter toutes les statistiques Store
        id: collecte
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/store-analytics/src
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          set +e
          python -m azerty_store_analytics.collector
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi

      - name: Se connecter à Azure par OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Vérifier la configuration Azure Blob
        shell: bash
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
        run: |
          test -n "$AZURE_STORAGE_ACCOUNT"
          test -n "$AZURE_STORAGE_CONTAINER"

      - name: Créer le conteneur privé si nécessaire
        shell: bash
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
        run: |
          az storage container create \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --name "$AZURE_STORAGE_CONTAINER" \
            --public-access off \
            --auth-mode login \
            --only-show-errors

      - name: Archiver dans Azure Blob
        shell: bash
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
        run: |
          az storage blob upload-batch \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --destination "$AZURE_STORAGE_CONTAINER" \
            --destination-path "microsoft-store/azerty-global" \
            --source "$STORE_ANALYTICS_OUTPUT" \
            --auth-mode login \
            --overwrite true \
            --only-show-errors

      # Seul cas rouge de la collecte elle-même : des données manquent après les
      # nouvelles tentatives. Le manifeste archivé porte `complete: false`.
      - name: Signaler les jeux de données manquants
        if: steps.collecte.outputs.code == '2'
        shell: bash
        run: |
          python - "$STORE_ANALYTICS_OUTPUT/manifest.json" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          failures = manifest["failures"]
          for f in failures:
              print(f"::error title=Jeu Store manquant : {f['dataset']}::{f['error']}")
          print(f"{len(failures)} jeu(x) manquant(s) dans le run {manifest['runId']}, "
                f"archivé avec complete=false ; les autres jeux sont archivés.")
          PY
          exit 1
