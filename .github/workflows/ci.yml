name: CI build + audit sécu

on:
  push:
    branches: [main, release/**, ci/verif]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permissions minimales par job (audit 1.3.0, A33) : seul build reçoit l'écriture dont
# l'attestation et l'envoi SARIF ont besoin ; provenance et actionlint ne font que lire.
# Une clé `permissions` de job remplace celle du workflow, elle ne s'y ajoute pas.
# Actions épinglées par SHA de commit complet, tag en commentaire, comme dans
# store-analytics.yml : un tag déplacé ne change plus le code qui produit le bundle.
permissions:
  contents: read

# Une PR ne garde que son dernier run : un nouveau push annule le précédent.
# Sur push, chaque run a son propre groupe (run_id) et va jusqu'au bout.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Job séparé, et volontairement pas un `needs:` du build : les trois JSON de src/ sont
  # des copies de fichiers protégés du dépôt du site, et ce contrôle lit l'original sur
  # son URL brute publique. Une panne réseau ne doit donc pas empêcher une release de se
  # construire — elle sort en 2, la dérive sort en 1, et le run passe au rouge dans les
  # deux cas. Pour rendre le contrôle bloquant, ajouter `needs: provenance` au job build.
  # L'original est lu au commit du site épinglé dans scripts/layout-provenance.json : une
  # évolution du site ne rougit plus les PR ; provenance-drift.yml la signale chaque jour.
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Les JSON embarqués sont identiques à leur original canonique
        run: python scripts/check-layout-provenance.py

  # Même contrôle que le hook .githooks/pre-push, mêmes options : shellcheck et pyflakes
  # désactivés des deux côtés, pour qu'un poste sans eux rende le même verdict.
  # Version et empreinte épinglées (asset de la release v1.7.12 de rhysd/actionlint).
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Installer actionlint épinglé
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint

      - name: Les workflows sont valides
        run: ./actionlint -color -shellcheck= -pyflakes=

  build:
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write  # envoi des SARIF BinSkim
      id-token: write         # attestation SLSA / sigstore
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Les étapes « ./scripts/verify.ps1 -Etape … » sont celles que le hook
      # .githooks/pre-push rejoue en entier sur le poste : une seule définition, deux
      # exécutions. Ajouter une étape bloquante exécutable sous Windows dans verify.ps1,
      # pas ici directement.

      # Sort en 1 dès qu'un nom, une URL ou un identifiant produit réapparaît en dur
      # hors de src/ProductIdentity.cs. Placé avant le build : le contrôle coûte une
      # seconde, la publication cinq minutes.
      - name: Aucun littéral d'identité hors ProductIdentity
        run: ./scripts/verify.ps1 -Etape identite

      # Ces trois étapes bloquent le build, contrairement au job provenance : elles ne
      # dépendent que du dépôt, et empaqueter une disposition malformée livrerait une
      # application qui démarre sans touches mortes.
      # Versions et empreintes verrouillées (scripts/requirements-ci.txt, régénéré depuis
      # requirements-ci.in) : ce job produit le bundle attesté, puis signé par AMCF.
      - name: Installer jsonschema
        run: python -m pip install --require-hashes --only-binary ":all:" -r scripts/requirements-ci.txt

      - name: La disposition est conforme à son schéma
        run: ./scripts/verify.ps1 -Etape schema

      - name: Témoins du schéma et de son accord avec le parseur
        run: ./scripts/verify.ps1 -Etape temoins

      - name: Tests du collecteur Store
        run: ./scripts/verify.ps1 -Etape store-analytics

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Restore + publish x64
        run: ./scripts/verify.ps1 -Etape publish-x64

      - name: Publish ARM64
        run: ./scripts/verify.ps1 -Etape publish-arm64

      - name: Test Core
        run: ./scripts/verify.ps1 -Etape tests-core

      - name: Test Windows engine
        run: ./scripts/verify.ps1 -Etape tests-windows

      - name: Test application
        run: ./scripts/verify.ps1 -Etape tests-app

      - name: Pack MSIX
        run: pwsh ./scripts/Pack-MSIX.ps1

      - name: Verify Release
        run: pwsh ./scripts/Verify-Release.ps1

      # BinSkim est distribué comme exécutable autonome, pas comme dotnet tool.
      # Le script épingle son empreinte et exige une analyse complète avec les PDB.
      - name: BinSkim hardening check
        run: python scripts/check-binary-hardening.py

      - name: SHA256 artefacts
        run: |
          Get-FileHash -Algorithm SHA256 "src/bin/Release/net10.0-windows10.0.17763.0/win-x64/publish/AZERTY Global.exe"
          Get-FileHash -Algorithm SHA256 "src/bin/Release/net10.0-windows10.0.17763.0/win-arm64/publish/AZERTY Global.exe"
          Get-ChildItem ./msix -Filter "AZERTYGlobal-*.msixbundle" | ForEach-Object { Get-FileHash -Algorithm SHA256 $_.FullName }

      - name: Upload msixbundle artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msixbundle
          path: msix/AZERTYGlobal-*.msixbundle
          retention-days: 90

      - name: Attest provenance (SLSA L1)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'msix/AZERTYGlobal-*.msixbundle'

      - name: Upload BinSkim SARIF x64
        if: always() && hashFiles('binskim-sarif/binskim-x64.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: binskim-sarif/binskim-x64.sarif
          category: binskim-x64

      - name: Upload BinSkim SARIF ARM64
        if: always() && hashFiles('binskim-sarif/binskim-arm64.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: binskim-sarif/binskim-arm64.sarif
          category: binskim-arm64

      - name: Conserver les preuves BinSkim même en cas d'échec
        if: always() && hashFiles('binskim-sarif/*') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binskim-evidence
          path: binskim-sarif/
          retention-days: 90
